[package]
name = "slop-chef"
version = "0.1.0"
edition = "2021"
description = "slop-chef — browse slop-kitchen, serve, stove, and chat."

[[bin]]
name = "slop-chef"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
