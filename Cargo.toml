[package]
name = "cook"
version = "0.1.0"
edition = "2021"
description = "TUI for managing AI agents. They cook."

[[bin]]
name = "kitchen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
